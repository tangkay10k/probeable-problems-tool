steps:
  # ─── Build the Docker image ───────────────────────────────────────────────
  - name: 'gcr.io/cloud-builders/docker'
    # make the secret available as an env var in this step
    secretEnv: [ 'VITE_GOOGLE_OAUTH_CLIENT_ID' ]
    args:
      [
        'build',
        # pass the secret in as a build‑arg to your Dockerfile
        '--build-arg', 'VITE_GOOGLE_OAUTH_CLIENT_ID=$VITE_GOOGLE_OAUTH_CLIENT_ID',
        # tag the image
        '-t', 'gcr.io/$PROJECT_ID/probeable:$SHORT_SHA',
        '.'
      ]

# tell Cloud Build where to pull the secret from
availableSecrets:
  secretManager:
    - versionName: 'projects/$PROJECT_ID/secrets/probeable-problems-google-client-id/versions/latest'
      env: 'VITE_GOOGLE_OAUTH_CLIENT_ID'

images:
  - 'gcr.io/$PROJECT_ID/probeable:$SHORT_SHA'
